name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the Pages deployment to claim the environment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling so a finished
# build always lands.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # `prepare: husky` runs on install and has nothing to do in CI.
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The editor resolves `@newkrok/three-particles` to ../three-particles
      # through its package.json `main`, which points at dist/ — so the library
      # has to be built before the editor is installed, not just present.
      - name: Build the particle library
        working-directory: packages/three-particles
        run: |
          npm install
          npm run build

      - name: Build the editor
        working-directory: packages/editor
        run: |
          npm install
          npm run build

      # Source maps are 7.5MB and are not needed by visitors.
      - name: Drop source maps
        run: rm -f packages/editor/public/build/*.map

      # V2 — Particle Tools Studio (packages/studio) — is served beside V1 at
      # /Studio/. Its build is self-contained (a relative base, its own copy of
      # the presets), so it is built here and dropped into V1's public folder.
      # Since 2026-09-18 both come from this one checkout of main.
      - name: Build the studio
        working-directory: packages/studio
        run: |
          npm install
          npm run build

      - name: Place the studio at /Studio/
        run: |
          rm -rf packages/editor/public/Studio packages/editor/public/studio
          cp -R packages/studio/dist packages/editor/public/Studio
          # Pages is case-sensitive; the lowercase address forwards.
          mkdir -p packages/editor/public/studio
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=../Studio/"><title>Particle Tools Studio</title><a href="../Studio/">Particle Tools Studio</a>' > packages/editor/public/studio/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/editor/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
