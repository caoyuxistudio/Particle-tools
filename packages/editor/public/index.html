<!DOCTYPE html>
<!-- Painted before any stylesheet arrives: the first frame is black, not white. -->
<html lang="en" style="background: #000">
  <head>
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=__GOOGLE_TAG_ID__"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "__GOOGLE_TAG_ID__");
    </script>
    <title>Three Particles Editor</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1, minimum-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <!--
      An iPhone has no element fullscreen; the only way to lose Safari's bars is
      to open the page from the Home Screen. These make that a chrome-free,
      edge-to-edge app window, status bar drawn over our (black) page.
    -->
    <!-- Kept at the piece's top-edge colour while it plays (world.ts): the bars a phone keeps take this colour. -->
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!--
      "default": the page sits below the status bar and the bar takes the
      page's theme-color — which world.ts keeps at the colour of the piece's
      top edge while it plays, so the bar reads as the picture continuing.
      iOS 27 beta gives a Home Screen web app a view the screen minus the
      status bar whatever the style (measured 894 of 956, on the manifest
      path and the legacy one alike); translucent only moves that view up
      under the bar and leaves the strip at the bottom, where nothing can
      tint it. Below the bar, tinted, is the best an iPhone web page can do.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Particles" />
    <!-- Favicon -->    
    <link rel="icon" href="./favicon/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="./favicon/favicon-48x48.png" />
    <link rel="apple-touch-icon" href="./favicon/apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <!--
      The fonts come from Google and must not block the first paint: a
      stylesheet linked plainly is render-blocking, and where Google is slow
      or unreachable the page stayed white until the request gave up. Loaded
      as a print sheet and switched to all media once it arrives, the page
      paints at once and the fonts swap in when they land.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      media="print"
      onload="this.media='all'"
    />
    <!-- Roboto -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,600,700"
      media="print"
      onload="this.media='all'"
    />
    <!-- Roboto Mono -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Roboto+Mono"
      media="print"
      onload="this.media='all'"
    />
    <!-- Dark only. The light theme is still compiled but never linked. -->
    <link rel="stylesheet" href="./build/static/smui-dark.css" />

    <link rel="stylesheet" href="./global.css" />
    <link rel="stylesheet" href="./build/bundle.css" />
    <script defer src="./build/bundle.js"></script>
  </head>
  <body></body>
</html>
